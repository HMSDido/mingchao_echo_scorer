name: 分享角色系数配置
description: 把你的角色系数配置分享给社区配置库
title: "[配置分享] <角色名称>"
labels:
  - community-preset
body:
  - type: markdown
    attributes:
      value: |
        感谢分享！填写以下内容即可，维护者会人工审阅并收录进
        `共享角色系数配置文件/<角色名>/`（同一角色的配置放同一个文件夹）。
        配置名称请标注**角色链数 + 专武链 + 角色名**，例如 `31绯雪系数`
        （在应用里新建或重命名配置时写好即可，链接里会带上这个名字）。
  - type: input
    id: character
    attributes:
      label: 角色名称
      description: 例如「绯雪」；同一角色的不同链数配置请注明声骸链数与专武链
      placeholder: 绯雪（声骸 3 链 / 专武 1 链）
    validations:
      required: true
  - type: input
    id: provider
    attributes:
      label: 提供者昵称 / ID
      description: 用于收录时署名
      placeholder: HMSDido
    validations:
      required: true
  - type: textarea
    id: share
    attributes:
      label: 分享链接
      description: >-
        在应用「编辑角色系数」页点配置右侧的 ⋮ →「复制分享链接」，
        把得到的整行 echoscorer://… 粘贴到这里；多份配置一行一条。
        请统一用应用内的这个导出方式，不要手写 JSON —— 机器人会解码后校验格式。
      placeholder: |
        echoscorer://eyJmb3JtYXQiOjEsImlkIjoicHJlc2V0LTMxLWZlaXh1ZSIsIm5hbWUiOiIzMee7r+mbquezu+aVsCIsImNvZWZmaWNpZW50cyI6eyJjcml0UmF0ZSI6MS4wLCJjcml0RG1nIjoxLjJ9LCJjcmVhdGVkQXQiOiIyMDI2LTEwLTAxVDExOjUyOjUwWiIsInVwZGF0ZWRBdCI6IjIwMjYtMTAtMDFUMTI6NTk6MzRaIn0=
    validations:
      required: true
  - type: textarea
    id: screenshot
    attributes:
      label: 评分效果截图（可选）
      description: 把应用内该角色五件声骸的评分结果截图拖到这里，方便其他玩家参考
      placeholder: 拖拽图片到此处即可上传
    validations:
      required: false

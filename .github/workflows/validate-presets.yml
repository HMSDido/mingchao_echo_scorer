name: 校验社区配置

# 只做一件事：检查社区提交的角色系数 JSON 能否被正常解析。
# 不校验系数数值大小、项数或取值范围 —— 权重是否合理由维护者人工审阅。
on:
  pull_request:
    paths:
      - '共享角色系数配置文件/**'
  issues:
    types: [opened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 列出本次新增的配置文件
        run: |
          # core.quotepath=off：否则 git 会把中文路径转义成 "\345\205\261..." 形式，
          # 下一步就会拿这个假路径去开文件，把每份正常配置都误报成解析失败。
          git -c core.quotepath=off diff --name-only --diff-filter=A \
            "origin/${{ github.base_ref }}"...HEAD \
            -- '共享角色系数配置文件/' | grep '\.json$' > added.txt || true
          echo "count=$(wc -l < added.txt)"
          cat added.txt

      - name: 检查 JSON 是否可解析
        id: check
        run: |
          status=0
          : > failed.md
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            if python3 -c 'import json,sys; json.load(open(sys.argv[1], encoding="utf-8-sig"))' "$file"; then
              echo "OK   $file"
            else
              echo "FAIL $file"
              status=1
              printf -- '- `%s`\n' "$file" >> failed.md
            fi
          done < added.txt
          # GITHUB_OUTPUT 按行解析 `name=value`，多行值必须用 heredoc 形式写出，
          # 否则从第二个失败文件开始的内容都会被丢掉。
          {
            echo "status=$status"
            echo "failed<<FEOF"
            cat failed.md
            echo "FEOF"
          } >> "$GITHUB_OUTPUT"
          exit 0

      - name: 解析失败时打标签并留言
        if: steps.check.outputs.status == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          FAILED: ${{ steps.check.outputs.failed }}
        run: |
          gh pr edit "$PR" --add-label invalid-preset
          gh pr comment "$PR" --body "$(cat <<EOF
          ### 配置文件解析失败

          以下新增的角色系数 JSON **无法被解析为合法 JSON**，暂时无法审阅收录：
          $FAILED

          请检查：
          - 是否有多余的逗号、引号不匹配或不可见字符；
          - 是否为应用「导出为 JSON」生成的原始文件（请勿手工改写外层结构）；
          - 文件是否放在 \`共享角色系数配置文件/\` 目录下、扩展名为 \`.json\`。

          修正后重新推送即可。本检查只看 JSON 能否正常解析，
          **不会校验系数数值大小或项数**，权重取值由维护者人工审阅。
          EOF
          )"

  issue:
    if: >-
      github.event_name == 'issues' &&
      contains(github.event.issue.labels.*.name, 'community-preset')
    runs-on: ubuntu-latest
    steps:
      - name: 提取并校验正文中的 JSON
        id: check
        env:
          BODY: ${{ github.event.issue.body }}
        run: |
          python3 <<'PY' >> "$GITHUB_OUTPUT"
          import os, re, json
          body = os.environ.get('BODY', '')
          # 优先取 ``` 围栏里的内容。
          blocks = re.findall(r'```[a-zA-Z]*\s*(.*?)```', body, re.S)
          if not blocks:
              # 没有围栏时，只把「行首就是 {」的段落当候选，避免把说明文字里
              # 随手写的 {大概 2.15} 误判成一份非法的 JSON。
              m = re.search(r'(?m)^\s*\{', body)
              blocks = [body[m.start():]] if m else []
          found = valid = 0
          for b in blocks:
              start = b.find('{')
              if start < 0:
                  continue
              # 必须做括号配对计数：角色系数 JSON 里嵌套了 coefficients 对象，
              # 用 .*? 这类非贪婪正则会截断到内层第一个 } 而误判成非法 JSON。
              depth = 0
              for i, ch in enumerate(b[start:], start):
                  if ch == '{':
                      depth += 1
                  elif ch == '}':
                      depth -= 1
                      if depth == 0:
                          cand = b[start:i + 1]
                          # JSON 的键必然带双引号；没有引号就不是一开始找的东西。
                          if '"' in cand:
                              found += 1
                              try:
                                  json.loads(cand)
                                  valid += 1
                              except Exception:
                                  pass
                          break
          status = 'valid' if valid else ('invalid' if found else 'none')
          print(f'found={found}')
          print(f'valid={valid}')
          print(f'status={status}')
          PY

      - name: 解析失败时打标签并留言
        if: steps.check.outputs.status == 'invalid'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          gh issue edit "$ISSUE" --add-label invalid-preset
          gh issue comment "$ISSUE" --body "$(cat <<'EOF'
          ### 粘贴的 JSON 无法解析

          机器人没能把内容读成合法 JSON。请用应用「导出为 JSON」生成的原始内容整段粘贴
          （建议包在三枚反引号的代码块里），或直接把 `.json` 文件拖进 Issue 作为附件上传。
          本检查**只验证 JSON 格式是否合法**，不涉及系数取值，最终权重由维护者人工审阅。
          EOF
          )"
